services:
  frontend:
    build:
      context: ./client
    image: toolbox-frontend:latest
    container_name: toolbox-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - backend-nginx

  backend:
    build:
      context: ./server
    image: toolbox-backend:latest
    container_name: toolbox-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
      - ./server/.env.docker
    volumes:
      - backend_public:/var/www/html/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: toolbox-backend-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - backend_public:/var/www/html/public:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: toolbox-postgres
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - toolbox_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: toolbox-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    image: toolbox-backend:latest
    container_name: toolbox-queue
    restart: unless-stopped
    env_file:
      - ./server/.env
      - ./server/.env.docker
    command: php artisan queue:work --tries=3 --timeout=30
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: toolbox-backend:latest
    container_name: toolbox-scheduler
    restart: unless-stopped
    env_file:
      - ./server/.env
      - ./server/.env.docker
    command: php artisan schedule:work
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  toolbox_pgdata:
  backend_public:
